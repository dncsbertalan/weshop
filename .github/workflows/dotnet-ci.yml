name: Test services

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore WeShop.sln

      - name: Build solution
        run: dotnet build WeShop.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test WeShop.sln --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --logger "trx"
